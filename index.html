<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gone Fishin' — Plan any trip</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#1d2a24;--muted:#66786f;--accent:#1f7a5a;--gold:#e0a93b;--line:#d9e4df;--warn:#b5473a;--ok:#2f8f5b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#17221e;--ink:#e6efea;--muted:#8ea399;--accent:#4fbf93;--gold:#e8b04a;--line:#2a3b34;--warn:#e27a6c;--ok:#4fbf93}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header{background:var(--accent);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:20px}
header p{margin:2px 0 0;opacity:.9;font-size:13px}
main{max-width:960px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
input,select{width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px}
button.btn{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:none;color:var(--accent);border:1px solid var(--line);padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
a.link{color:var(--accent);font-weight:600;font-size:13px}
.muted{color:var(--muted);font-size:13px}
.warn{color:var(--warn);font-size:13px}
.big{font-size:22px;font-weight:700}
.score{font-size:46px;font-weight:800;color:var(--accent);line-height:1}
.pill{display:inline-block;background:var(--line);border-radius:99px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.pill.peak{background:var(--gold);color:#222;font-weight:600}
.hatch{border-top:1px solid var(--line);padding:10px 0}
.hatch:first-child{border-top:0}
.results{margin:6px 0 0;padding:0;list-style:none}
.results li{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.results li:hover{border-color:var(--accent)}
ul.tips{padding-left:18px;margin:6px 0}
ul.tips li{margin-bottom:4px}
.hidden{display:none}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>🎣 Gone Fishin'</h1>
  <p>Pick a place and a date. See the weather, water, and what should be hatching.</p>
  <button id="unitBtn" onclick="toggleUnits()" style="margin-top:8px;background:transparent;color:#fff;border:1px solid #ffffff90;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer"></button>
</header>
<main>

<section class="card">
  <h2>Where and when</h2>
  <div class="row">
    <label style="flex:2 1 260px">Search a place (lake, creek, town, trailhead)
      <input id="q" placeholder="e.g. Rose Canyon Lake, Oak Creek, Chevelon Creek" autocomplete="off">
    </label>
    <button class="btn" onclick="searchPlace()">Search</button>
  </div>
  <p class="muted" id="placeMsg"></p>
  <ul id="results" class="results"></ul>
  <details style="margin-top:8px">
    <summary class="muted">Enter coordinates instead</summary>
    <div class="row" style="margin-top:8px">
      <label>Latitude<input id="lat" type="number" step="any"></label>
      <label>Longitude<input id="lon" type="number" step="any"></label>
      <label>Name<input id="pname" placeholder="My spot"></label>
      <label><span id="elevLabel">Elevation (ft, optional)</span><input id="elev" type="number" placeholder="e.g. 7000 for Rose Canyon"></label>
    </div>
  </details>
  <div class="row" style="margin-top:4px">
    <label>Water type
      <select id="habitat">
        <option value="stream">Stream / river</option>
        <option value="stillwater">Lake / pond / reservoir</option>
      </select>
    </label>
  </div>
  <div class="row" style="margin-top:8px">
    <label>Date
      <input id="date" type="date">
    </label>
    <label>Time of day
      <select id="when">
        <option value="day">Whole day</option>
        <option value="am">Morning (dawn to noon)</option>
        <option value="pm">Afternoon (noon to dusk)</option>
      </select>
    </label>
    <button class="btn" onclick="usePlace()">Get the plan</button>
  </div>
  <p class="muted">Forecasts cover the next 16 days. Dates further out use typical conditions from last year.</p>
  <div id="saved" style="margin-top:10px"></div>
</section>

<div id="output" class="hidden">
  <div class="grid2">
    <section class="card" id="conditions"></section>
    <section class="card" id="water"></section>
  </div>
  <section class="card" id="verdict"></section>
  <section class="card" id="outlook"></section>
  <section class="card" id="hatches"></section>
  <section class="card" id="tips"></section>
  <section class="card src" id="sources"></section>
</div>

</main>

<script src="data/hatches.js"></script>
<script>
const DB = window.HATCH_DB;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const SAVE_KEY = 'gone-fishin-places-v2';
let place = null;   // {name, lat, lon, habitat, lakeId}
let ELEV_M = null;  // elevation in metres sent to Open-Meteo, if known
const cF = c => (c * 9 / 5 + 32).toFixed(0);
const LOCALE_REGION = (() => { try { return new Intl.Locale(navigator.language).region || ''; } catch(e) { return ''; } })();
let UNITS = localStorage.getItem('gone-fishin-units') || (['US','LR','MM'].includes(LOCALE_REGION) ? 'imperial' : 'metric');
const isImperial = () => UNITS === 'imperial';
const fmtTemp = c => isImperial() ? `${(c*9/5+32).toFixed(0)} °F` : `${c.toFixed(0)} °C`;      // input °C
const fmtTempF = f => isImperial() ? `${f.toFixed(0)} °F` : `${((f-32)*5/9).toFixed(0)} °C`;     // input °F
const fmtWind = kmh => isImperial() ? `${(kmh*0.621371).toFixed(0)} mph` : `${kmh.toFixed(0)} km/h`;
const fmtRain = mm => isImperial() ? `${(mm/25.4).toFixed(2)} in` : `${mm.toFixed(1)} mm`;
const fmtElev = m => isImperial() ? `${Math.round(m*3.28084)} ft` : `${Math.round(m)} m`;   // input m
const fmtFlow = cfs => isImperial() ? `${cfs} cfs` : `${(cfs*0.0283168).toFixed(2)} m³/s`;
function toggleUnits(){
  UNITS = isImperial() ? 'metric' : 'imperial';
  try { localStorage.setItem('gone-fishin-units', UNITS); } catch(e) {}
  updateUnitUI();
  if (place) runPlan();
}
function updateUnitUI(){
  $('unitBtn').textContent = isImperial() ? 'Switch to km / °C' : 'Switch to miles / °F';
  $('elevLabel').textContent = isImperial() ? 'Elevation (ft, optional)' : 'Elevation (m, optional)';
}
const shiftDay = (s, n) => { const [y,m,d] = s.split('-').map(Number); return iso(new Date(y, m-1, d+n)); };

function loadSaved(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; } catch(e){ return []; } }
function saveAll(list){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(list)); } catch(e){} }

/* ---------- place lookup ---------- */
async function searchPlace(){
  const q = $('q').value.trim();
  if (!q) return;
  $('placeMsg').textContent = 'Searching…';
  $('results').innerHTML = '';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&countrycodes=us&q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();
    const hits = raw.map(x => ({
      name: x.name || (x.display_name || '').split(',')[0],
      admin1: x.address?.state,
      country: x.address?.country,
      latitude: parseFloat(x.lat),
      longitude: parseFloat(x.lon),
      kind: (x.type || x.class || '').toLowerCase()
    })).filter(h => !isNaN(h.latitude) && !isNaN(h.longitude));
    $('placeMsg').textContent = hits.length ? 'Pick a result, or enter coordinates by hand.' : 'No matches. Try adding the town, like "Rose Canyon Lake, Tucson" or "Oak Creek, Sedona."';
    $('results').innerHTML = hits.map((h,i) => `<li onclick="pickResult(${i})"><b>${esc(h.name)}</b> <span class="pill">${esc(h.kind || 'place')}</span><br><span class="muted">${esc([h.admin1,h.country].filter(Boolean).join(', '))} · ${h.latitude.toFixed(3)}, ${h.longitude.toFixed(3)}</span></li>`).join('');
    window._hits = hits;
  } catch(e) {
    $('placeMsg').innerHTML = `<span class="warn">Search unavailable (${esc(e.message)}). Enter coordinates below.</span>`;
  }
}
function pickResult(i){
  const h = window._hits[i];
  $('lat').value = h.latitude; $('lon').value = h.longitude; $('pname').value = h.name; window._state = h.admin1 || ''; window._country = h.country || '';
  $('results').innerHTML = '';
  $('placeMsg').textContent = `Set to ${h.name}. Check the water type, then press "Get the plan".`;
  // set water type from what the search says it is
  const k = h.kind || '';
  if (['lake','reservoir','pond'].includes(k)) $('habitat').value = 'stillwater';
  else if (['river','stream','creek','canal','ditch'].includes(k)) $('habitat').value = 'stream';
  // match a known lake by name
  const match = DB.lakes.find(l => h.name.toLowerCase().includes(l.name.split(' (')[0].toLowerCase().split(' lake')[0]));
  if (match) { $('habitat').value = 'stillwater'; $('placeMsg').textContent += ` Matched known lake: ${match.name.split(' (')[0]}.`; }
}
function usePlace(){
  const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  if (isNaN(lat) || isNaN(lon)) { $('placeMsg').innerHTML = '<span class="warn">Enter a latitude and longitude, or search for a place.</span>'; return; }
  const name = $('pname').value.trim() || `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
  const lake = DB.lakes.find(l => l.name.toLowerCase().includes(name.toLowerCase()) || name.toLowerCase().includes(l.name.split(' (')[0].toLowerCase()));
  place = { name, lat, lon, habitat: $('habitat').value, lakeId: lake ? lake.id : null };
  const list = loadSaved().filter(p => p.name !== place.name);
  list.unshift({ name, lat, lon, habitat: place.habitat, lakeId: place.lakeId });
  saveAll(list.slice(0, 12));
  renderSaved();
  runPlan();
}
function loadPlace(p){
  $('lat').value = p.lat; $('lon').value = p.lon; $('pname').value = p.name; $('habitat').value = p.habitat;
  place = p; runPlan();
}
function renderSaved(){
  const list = loadSaved();
  $('saved').innerHTML = list.length ? '<div class="muted" style="margin-bottom:4px">Saved places</div>' + list.map((p,i) =>
    `<span class="pill" style="cursor:pointer" onclick="loadPlace(loadSaved()[${i}])">${esc(p.name)}</span>`).join('') : '';
}

/* ---------- weather & water data ---------- */
function daysFromToday(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(y, m-1, d) - t) / 86400000);
}
function lastYear(dateStr){ return (parseInt(dateStr.slice(0,4)) - 1) + dateStr.slice(4); }

// National Weather Service (US only): 2.5 km grid forecast + nearest station observation
async function nwsForecast(lat, lon, dateStr, win = 'day'){
  const H = { 'Accept': 'application/geo+json' };
  const pr = await fetch(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`, { headers: H });
  if (!pr.ok) throw new Error('points HTTP ' + pr.status);
  const p = (await pr.json()).properties;
  const hr = await fetch(p.forecastHourly, { headers: H });
  if (!hr.ok) throw new Error('hourly HTTP ' + hr.status);
  const periods = (await hr.json()).properties.periods;
  const inWin = hr => win === 'am' ? hr <= 12 : win === 'pm' ? hr >= 12 : (hr >= 6 && hr <= 20);
  const day = periods.filter(x => x.startTime.slice(0,10) === dateStr && inWin(parseInt(x.startTime.slice(11,13))));
  if (!day.length) throw new Error('no NWS hours for this date');
  const tC = day.map(x => (x.temperature - 32) * 5 / 9);
  const kmh = day.map(x => (parseFloat(x.windSpeed) || 0) / 0.621371);
  const pops = day.map(x => x.probabilityOfPrecipitation?.value).filter(v => v != null);
  let obs = null;
  try {
    const sr = await (await fetch(p.observationStations, { headers: H })).json();
    const sid = sr.features?.[0]?.properties?.stationIdentifier;
    if (sid) {
      const o = (await (await fetch(`https://api.weather.gov/stations/${sid}/observations/latest`, { headers: H })).json()).properties;
      obs = { temp: o.temperature?.value ?? null, wind: o.windSpeed?.value ?? null, station: sid };
      if (obs.temp != null) obs.temp = obs.temp; // already °C
      if (obs.wind != null) obs.wind = obs.wind; // already km/h
    }
  } catch(e) { obs = null; }
  const mean = arr => arr.reduce((s,v) => s + v, 0) / arr.length;
  return {
    tempC: mean(tC), maxC: Math.max(...tC), minC: Math.min(...tC),
    windKmh: mean(kmh), popMax: pops.length ? Math.max(...pops) : null,
    obs, src: obs ? `station ${obs.station}, 2.5 km grid` : '2.5 km grid'
  };
}
async function getForecast(lat, lon, dateStr){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&hourly=temperature_2m,wind_speed_10m,precipitation_probability,cloud_cover,pressure_msl` +
    `&current=temperature_2m,wind_speed_10m,cloud_cover` +
    `&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
    `&timezone=auto&start_date=${dateStr}&end_date=${dateStr}` + (ELEV_M != null ? `&elevation=${ELEV_M}` : '');
  const r = await fetch(url); if (!r.ok) throw new Error('forecast HTTP ' + r.status);
  return r.json();
}
async function getArchive(lat, lon, dateStr){
  const d = lastYear(dateStr);
  const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}` +
    `&start_date=${d}&end_date=${d}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset&timezone=auto` + (ELEV_M != null ? `&elevation=${ELEV_M}` : '');
  const r = await fetch(url); if (!r.ok) throw new Error('archive HTTP ' + r.status);
  return { data: await r.json(), date: d };
}
async function getHistory(lat, lon, startStr, endStr){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&daily=temperature_2m_mean&timezone=auto&start_date=${startStr}&end_date=${endStr}` +
    (ELEV_M != null ? `&elevation=${ELEV_M}` : '');
  const r = await fetch(url); if (!r.ok) throw new Error('history HTTP ' + r.status);
  const d = await r.json();
  return d.daily.temperature_2m_mean; // °C, oldest first
}
// Rough estimate: water follows air with a lag. Lakes respond slowly, streams faster.
function estimateWaterF(meansC, habitat){
  const vals = meansC.filter(v => v != null);
  if (!vals.length) return null;
  const a = habitat === 'stillwater' ? 0.12 : 0.35;
  let e = vals[0];
  for (const t of vals.slice(1)) e = a * t + (1 - a) * e;
  return e * 9 / 5 + 32;
}
async function getUSGS(lat, lon){
  const pad = 0.2;
  const bbox = [lon-pad, lat-pad, lon+pad, lat+pad].map(x => x.toFixed(4)).join(',');
  const url = `https://waterservices.usgs.gov/nwis/iv/?format=json&bBox=${bbox}&parameterCd=00010,00060&siteStatus=active`;
  const r = await fetch(url); if (!r.ok) throw new Error('USGS HTTP ' + r.status);
  const d = await r.json();
  const sites = {};
  for (const ts of (d.value?.timeSeries || [])) {
    const code = ts.variable.variableCode[0].value;
    const name = ts.sourceInfo.siteName;
    const vals = ts.values[0].value; const last = vals[vals.length-1];
    if (!last) continue;
    const key = ts.sourceInfo.siteCode[0].value;
    sites[key] = sites[key] || { name, temp: null, flow: null, time: last.dateTime };
    if (code === '00010') sites[key].temp = { c: parseFloat(last.value), f: parseFloat(last.value)*9/5+32 };
    if (code === '00060') sites[key].flow = parseFloat(last.value);
  }
  return Object.values(sites);
}

/* ---------- scoring ---------- */
function hourlyDayAverages(f, dateStr, win = 'day'){
  const h = f.hourly, idx = [];
  h.time.forEach((t,i) => { if (t.startsWith(dateStr)) idx.push(i); });
  const pick = (k, arr) => arr.reduce((s,i) => s + h[k][i], 0) / arr.length;
  const sr = parseInt(f.daily.sunrise[0].slice(11,13)), ss = parseInt(f.daily.sunset[0].slice(11,13));
  const inWin = hr => win === 'am' ? (hr >= sr-1 && hr <= 12) : win === 'pm' ? (hr >= 12 && hr <= ss) : (hr >= sr-1 && hr <= ss);
  const fishing = idx.filter(i => inWin(parseInt(h.time[i].slice(11,13))));
  const use = fishing.length ? fishing : idx;
  return {
    temp: pick('temperature_2m', use),
    wind: pick('wind_speed_10m', use),
    cloud: pick('cloud_cover', use),
    rainChance: Math.max(...use.map(i => h.precipitation_probability[i])),
    pressure: pick('pressure_msl', use),
    sunrise: f.daily.sunrise[0].slice(11,16), sunset: f.daily.sunset[0].slice(11,16),
    hours: use.map(i => h.time[i].slice(11,16))
  };
}
function scoreDay(a){
  let s = 60; const why = [];
  if (a.wind > 20) { s -= 25; why.push(`Wind averaging ${fmtWind(a.wind)}. Casting is hard; fish sheltered banks.`); }
  else if (a.wind > 12) { s -= 10; why.push(`Breezy (${fmtWind(a.wind)}). Look for sheltered water.`); }
  else if (a.wind <= 6) { s += 5; why.push('Calm; rises are easier to see.'); }
  if (a.rainChance > 60) { s -= 15; why.push(`Rain chance up to ${a.rainChance}%. Watch for rising water.`); }
  else if (a.rainChance > 30) { s -= 5; why.push(`Some rain possible (${a.rainChance}%).`); }
  if (a.cloud >= 30 && a.cloud <= 80) { s += 10; why.push('Partly cloudy skies often keep fish active.'); }
  else if (a.cloud < 10) { s -= 5; why.push('Bright sun; fish may move to shade or deeper water.'); }
  const tF = a.temp * 9/5 + 32; // Open-Meteo returns °C here
  if (tF >= 45 && tF <= 75) { s += 10; why.push('Air temperature is comfortable for fishing.'); }
  else if (tF < 32 || tF > 95) { s -= 15; why.push('Extreme air temperature; fish may be sluggish.'); }
  s = Math.max(0, Math.min(100, Math.round(s)));
  return { s, label: s>=75 ? 'Excellent' : s>=55 ? 'Good' : s>=35 ? 'Fair' : 'Tough', why };
}

/* ---------- hatches for a date ---------- */
function activeHatches(month, habitat, waterF, insectIds){
  const list = DB.insects.filter(i => i.habitat.includes(habitat) && i.months.includes(month));
  return list.map(ins => {
    let tempNote = null, gate = true;
    if (ins.water_temp_f) {
      if (waterF == null) tempNote = `Needs water temp (usually ${fmtTempF(ins.water_temp_f.min)} to ${fmtTempF(ins.water_temp_f.max)})`;
      else if (waterF < ins.water_temp_f.min || waterF > ins.water_temp_f.max) { gate = false; tempNote = `Water ${fmtTempF(waterF)} is outside the usual ${fmtTempF(ins.water_temp_f.min)} to ${fmtTempF(ins.water_temp_f.max)}`; }
    }
    const lakeBoost = insectIds && insectIds.includes(ins.id);
    return { ins, gate, tempNote, peak: ins.peak_months.includes(month), lakeBoost };
  }).filter(h => h.gate).sort((a,b) => (b.peak - a.peak) || (b.lakeBoost - a.lakeBoost));
}
function fmtFly(flies){ return flies.map(f => `${esc(f.pattern)} <span class="muted">(size ${esc(f.sizes)})</span>`).join('<br>'); }

/* ---------- main ---------- */
async function runPlan(){
  if (!place) {
    const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
    if (isNaN(lat) || isNaN(lon)) { $('placeMsg').innerHTML = '<span class="warn">Pick a place first.</span>'; return; }
    place = { name: $('pname').value.trim() || 'My spot', lat, lon, habitat: $('habitat').value, lakeId: null };
  }
  const lakeE = place.lakeId ? DB.lakes.find(l => l.id === place.lakeId) : null;
  const elevIn = parseFloat($('elev').value);
  const elevFt = (!isNaN(elevIn) && elevIn > 0) ? (isImperial() ? elevIn : elevIn / 0.3048) : (lakeE ? lakeE.elevation_ft : null);
  ELEV_M = elevFt ? Math.round(elevFt * 0.3048) : null;
  const dateStr = $('date').value || iso(new Date());
  const win = $('when').value;
  const winName = {day:'Fishing-hours', am:'Morning', pm:'Afternoon'}[win];
  $('date').value = dateStr;
  $('output').classList.remove('hidden');
  const days = daysFromToday(dateStr);
  $('conditions').innerHTML = '<p class="muted">Loading weather…</p>';
  $('water').innerHTML = '<p class="muted">Loading water data…</p>';
  $('verdict').innerHTML = ''; $('hatches').innerHTML = ''; $('tips').innerHTML = ''; $('sources').innerHTML = '';

  const [mm, dd] = [parseInt(dateStr.slice(5,7)), parseInt(dateStr.slice(8,10))];
  const month = parseInt(dateStr.slice(5,7));
  const lake = place.lakeId ? DB.lakes.find(l => l.id === place.lakeId) : null;
  const habitat = place.habitat;

  // weather
  let wx = null, wxNote = '', wxSource = '';
  try {
    if (days >= 0 && days <= 15) {
      const f = await getForecast(place.lat, place.lon, dateStr);
      wx = { kind: 'forecast', a: hourlyDayAverages(f, dateStr, win), d: f.daily, elev: f.elevation, cur: f.current };
      wxSource = 'Open-Meteo forecast (global model, about 11 km grid)';
      try {
        const n = await nwsForecast(place.lat, place.lon, dateStr, win);
        wx.a.temp = n.tempC; wx.a.wind = n.windKmh;
        if (n.popMax != null) wx.a.rainChance = n.popMax;
        wx.d = { temperature_2m_max: [n.maxC], temperature_2m_min: [n.minC] };
        wx.cur = (n.obs && n.obs.temp != null) ? { temperature_2m: n.obs.temp, wind_speed_10m: n.obs.wind ?? 0 } : null;
        wx.src = n.src;
        wxSource = 'National Weather Service (' + n.src + ')';
      } catch(e) {
        wxSource += ' - NWS not available: ' + e.message;
      }
    } else {
      const { data, date } = await getArchive(place.lat, place.lon, dateStr);
      const dl = data.daily;
      wx = { kind: 'typical', date, tmax: dl.temperature_2m_max[0], tmin: dl.temperature_2m_min[0], precip: dl.precipitation_sum[0], sunrise: dl.sunrise[0].slice(11,16), sunset: dl.sunset[0].slice(11,16) };
      wxSource = 'Open-Meteo historical archive';
      wxNote = `No forecast this far out. Showing ${date}, the same day last year.`;
    }
  } catch(e) {
    wxNote = `Weather unavailable (${e.message}). Check the forecast in your weather app.`;
  }

  // water
  let usgs = [], usgsNote = '';
  try {
    usgs = await getUSGS(place.lat, place.lon);
    if (!usgs.length) usgsNote = 'No active USGS gauge within about 15 miles. The water temperature is estimated instead.';
  } catch(e) {
    usgsNote = `USGS data unavailable (${e.message}).`;
  }
  // no measurement? estimate from the three weeks of air temperature before the date
  const anchor = days > 15 ? lastYear(dateStr) : dateStr;
  let estF = null;
  try {
    const hist = await getHistory(place.lat, place.lon, shiftDay(anchor, -21), shiftDay(anchor, -1));
    estF = estimateWaterF(hist, place.habitat);
  } catch(e) { estF = null; }
  const measuredF = usgs.find(s => s.temp)?.temp?.f ?? null;
  const waterF = measuredF ?? estF;
  const waterSrc = (measuredF != null ? 'USGS gauge'
    : (estF != null ? 'ESTIMATE from the last 3 weeks of air temperature (rough, about ' + (isImperial() ? '±5 °F' : '±3 °C') + ')' : 'none'));

  // conditions card
  if (wx && wx.kind === 'forecast') {
    const a = wx.a, sc = scoreDay(a);
    $('conditions').innerHTML = `<h2>Conditions</h2>
      <div class="big">High ${fmtTemp(wx.d.temperature_2m_max[0])} · Low ${fmtTemp(wx.d.temperature_2m_min[0])}</div>
      <div class="muted">${winName} average ${fmtTemp(a.temp)}</div>
      ${days === 0 && wx.cur ? `<div class="muted">Right now (${wx.src ? 'nearest station' : 'model'}): ${fmtTemp(wx.cur.temperature_2m)}, wind ${fmtWind(wx.cur.wind_speed_10m)}</div>` : ''}
      <div class="muted">Wind ${fmtWind(a.wind)} · Cloud ${a.cloud.toFixed(0)}% · Rain chance ${a.rainChance}%</div>
      <div class="muted">Sunrise ${a.sunrise} · Sunset ${a.sunset}</div>
      <div class="muted">Forecast grid elevation ${wx.elev != null ? fmtElev(wx.elev) : '?'}${ELEV_M != null ? ` · adjusted to ${fmtElev(ELEV_M)}` : ' · set an elevation above to correct mountain sites'}</div>
      <div style="margin-top:10px"><span class="score">${sc.s}</span> <b>${sc.label}</b></div>
      <ul class="tips">${sc.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
      <div class="muted">Daytime averages shown.</div>`;
    window._score = sc;
  } else if (wx) {
    $('conditions').innerHTML = `<h2>Typical conditions</h2>
      <div class="big">${fmtTemp(wx.tmin)} to ${fmtTemp(wx.tmax)}</div>
      <div class="muted">Rain last year on this day: ${fmtRain(wx.precip)}</div>
      <div class="muted">Sunrise ${wx.sunrise} · Sunset ${wx.sunset}</div>
      <p class="muted">${esc(wxNote)}</p>`;
    window._score = null;
  } else {
    $('conditions').innerHTML = `<h2>Conditions</h2><p class="warn">${esc(wxNote)}</p>`;
    window._score = null;
  }

  // water card
  const gauge = usgs.find(s => s.temp) || usgs[0];
  $('water').innerHTML = `<h2>Water</h2>
    ${waterF != null ? `<div class="big">${fmtTempF(waterF)}</div><div class="muted">Source: ${esc(waterSrc)}</div>` : '<div class="muted">No water temperature yet.</div>'}
    ${gauge ? `<div style="margin-top:8px"><b>${esc(gauge.name)}</b><div class="muted">${gauge.flow != null ? `Flow ${fmtFlow(gauge.flow)}` : 'No flow reading'} · last ${esc(gauge.time?.slice(0,16).replace('T',' '))}</div></div>` : ''}
    <p class="muted">${esc(usgsNote)}</p>
    ${habitat === 'stillwater' ? '<p class="muted">Lakes usually have no USGS gauge, so the water temperature is estimated from recent air temperatures.</p>' : ''}`;

  // hatches
  const hatches = activeHatches(month, habitat, waterF, lake ? lake.insect_ids : null);
  const peakCount = hatches.filter(h => h.peak).length;
  $('hatches').innerHTML = `<h2>Hatches expected in ${MONTHS[month-1]}</h2>
    <p class="muted">${hatches.length} possible. ${peakCount} typically peak this month. Based on regional guide data, not local counts.</p>
    ${hatches.length ? hatches.map(h => `
      <div class="hatch">
        <b>${esc(h.ins.name)}</b>
        ${h.peak ? '<span class="pill peak">peak month</span>' : '<span class="pill">active</span>'}
        ${h.lakeBoost ? '<span class="pill">known at this lake</span>' : ''}
        ${h.tempNote ? `<span class="pill">${esc(h.tempNote)}</span>` : ''}
        <div class="muted" style="margin-top:4px">${esc(h.ins.time_of_day)}</div>
        <div style="margin-top:4px">${fmtFly(h.ins.flies)}</div>
        <div class="muted" style="margin-top:4px">${esc(h.ins.notes)}</div>
        <div class="src">${h.ins.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')}</div>
      </div>`).join('') : '<p class="muted">Nothing in the database for this month and water type.</p>'}`;

  // verdict + tips
  const tips = [];
  if (lake) tips.push(`${esc(lake.name.split(' (')[0])}: ${lake.species.map(s => esc(s.name)).join(', ')}. ${esc(lake.fishing_season_note)}`);
  if (wx && wx.kind === 'forecast' && wx.a.rainChance > 30 && month >= 7 && month <= 9) tips.push('Monsoon season (July to September): storms can raise streams fast. Stay out of washes and creek beds.');
  if (usgs.some(s => s.flow != null) && wx && wx.kind === 'forecast' && wx.a.rainChance > 30) tips.push('Rain forecast and a flowing gauge: check the flow reading again the morning of your trip.');
  if (habitat === 'stream') tips.push('Stream tip: fish the early and late hours when cloud cover is up.');
  if (habitat === 'stillwater') tips.push('Lake tip: check the shallow weedy edges for midge and Callibaetis activity.');
  $('tips').innerHTML = `<h2>Notes for ${esc(place.name)}</h2><ul class="tips">${tips.map(t => `<li>${t}</li>`).join('')}</ul>`;

  // verdict
  const bits = [];
  if (window._score) bits.push(`Conditions: <b>${window._score.label}</b> (${window._score.s}/100)`);
  if (waterF != null) bits.push(`Water ${fmtTempF(waterF)}`);
  bits.push(`${hatches.length} possible hatches`);
  $('verdict').innerHTML = `<h2>Summary</h2><div>${bits.join(' · ')}</div>
    <div style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center"><a class="link" target="_blank" rel="noopener" href="${calLink()}">Add to Google Calendar →</a><button class="ghost" onclick="copyShare()">Copy share link</button><span id="shareMsg" class="muted"></span><a class="link" target="_blank" rel="noopener" href="${regsLink()}">License &amp; regulations →</a></div>`;

  // sources
  renderOutlook(place.lat, place.lon);
  $('sources').innerHTML = `Weather: ${esc(wxSource || 'unavailable')}. Water: USGS Water Services. Hatch data: regional guide pages and a 1986 Sonoran Desert study; see each entry. <b>Verify locally before a trip.</b>`;
}

/* ---------- extras ---------- */
async function renderOutlook(lat, lon){
  const H = { 'Accept': 'application/geo+json' };
  try {
    const p = (await (await fetch(`https://api.weather.gov/points/${lat.toFixed(4)},${lon.toFixed(4)}`, { headers: H })).json()).properties;
    const periods = (await (await fetch(p.forecastHourly, { headers: H })).json()).properties.periods;
    const byDay = {};
    for (const x of periods) { const d = x.startTime.slice(0,10); (byDay[d] = byDay[d] || []).push(x); }
    const rows = Object.keys(byDay).slice(0,7).map(d => {
      const hs = byDay[d];
      const t = hs.map(x => x.temperature);
      const pops = hs.map(x => x.probabilityOfPrecipitation?.value).filter(v => v != null);
      const wind = hs.map(x => parseFloat(x.windSpeed) || 0);
      const mid = hs[Math.floor(hs.length / 2)];
      return { d, hi: Math.max(...t), lo: Math.min(...t), pop: pops.length ? Math.max(...pops) : null, wind: Math.max(...wind), desc: mid.shortForecast };
    });
    $('outlook').innerHTML = `<h2>7-day outlook (National Weather Service)</h2>
      <table><tr><th>Day</th><th>High / low</th><th>Rain chance</th><th>Max wind</th><th>Sky</th></tr>` +
      rows.map(r => `<tr><td>${new Date(r.d + 'T12:00:00').toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'})}</td>
        <td>${fmtTempF(r.hi)} / ${fmtTempF(r.lo)}</td><td>${r.pop != null ? r.pop + '%' : '—'}</td>
        <td>${fmtWind(r.wind / 0.621371)}</td><td>${esc(r.desc)}</td></tr>`).join('') +
      `</table>`;
  } catch(e) {
    $('outlook').innerHTML = `<h2>7-day outlook</h2><p class="muted">Not available here (${esc(e.message)}). The National Weather Service covers the US only.</p>`;
  }
}
function shareLink(){
  const q = new URLSearchParams({ name: place.name, lat: place.lat, lon: place.lon, habitat: place.habitat,
    date: $('date').value, when: $('when').value, elev: $('elev').value || '' });
  return location.origin + location.pathname + '?' + q.toString();
}
function calLink(){
  const d = $('date').value.replace(/-/g, '');
  const next = shiftDay($('date').value, 1).replace(/-/g, '');
  const text = `Fishing: ${place.name}`;
  const details = `Planned with Gone Fishin'\n${shareLink()}`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(text)}&dates=${d}/${next}&details=${encodeURIComponent(details)}&location=${encodeURIComponent(place.name)}`;
}
async function copyShare(){
  const t = shareLink();
  try { await navigator.clipboard.writeText(t); $('shareMsg').textContent = 'Link copied.'; }
  catch(e) { $('shareMsg').textContent = t; }
}
// Official wildlife agency pages for states we know; everything else gets a specific search
const WILDLIFE_AGENCY = {
  'Arizona': 'https://www.azgfd.gov',
  'Colorado': 'https://cpw.state.co.us',
  'California': 'https://wildlife.ca.gov',
  'Utah': 'https://wildlife.utah.gov'
};
function regsLink(){
  const state = window._state || '';
  if (WILDLIFE_AGENCY[state]) return WILDLIFE_AGENCY[state];
  const q = [place.name, state, window._country || '', 'fishing license and regulations'].filter(Boolean).join(' ');
  return 'https://www.google.com/search?q=' + encodeURIComponent(q);
}

/* ---------- init ---------- */
$('date').value = iso(new Date());
updateUnitUI();
renderSaved();
const sp = new URLSearchParams(location.search);
if (sp.get('lat') && sp.get('lon')) {
  const nm = sp.get('name') || 'Shared place';
  const lk = DB.lakes.find(l => nm.toLowerCase().includes(l.name.split(' (')[0].toLowerCase().split(' lake')[0]));
  $('lat').value = sp.get('lat'); $('lon').value = sp.get('lon'); $('pname').value = nm;
  $('habitat').value = sp.get('habitat') || 'stream';
  if (sp.get('date')) $('date').value = sp.get('date');
  if (sp.get('when')) $('when').value = sp.get('when');
  if (sp.get('elev')) $('elev').value = sp.get('elev');
  place = { name: nm, lat: parseFloat(sp.get('lat')), lon: parseFloat(sp.get('lon')), habitat: sp.get('habitat') || 'stream', lakeId: lk ? lk.id : null };
  runPlan();
}
</script>
